# This workflow will install Python dependencies test building docs
name: Building Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    #
    runs-on: ${{ matrix.platform }}
    #
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache sample data
      uses: actions/cache@v4
      with:
        path: ~/.padre_meddea/data
        key: padre-sample-data-${{ runner.os }}-${{ hashFiles('padre_meddea/data/_sample.py') }}
        restore-keys: |
          padre-sample-data-${{ runner.os }}-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -e '.[docs]'
    - name: Build docs
      run: sphinx-build docs docs/_build/html -W -b html
